<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define o nome exibido na aba do navegador. -->
    <title>Meus sites favoritos</title>
    <style>
        /* Estilos gerais da página */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #eef2ff;
            background: radial-gradient(circle at top, #1e3a5f 0, #0b1220 48%, #070b13 100%);
            min-height: 100vh;
        }
        header { text-align: center; padding: 54px 20px 30px; }
        header p { color: #a9b8d0; margin: 12px 0 0; }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); }
        main {
            width: min(1120px, 92%);
            margin: 0 auto 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 24px;
        }
        .site-card {
            overflow: hidden;
            background: rgba(20, 31, 49, .92);
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 14px 35px rgba(0,0,0,.24);
            transition: transform .2s ease, border-color .2s ease;
        }
        .site-card:hover { transform: translateY(-6px); border-color: #60a5fa; }
        h2 { font-size: 1.35rem; margin: 2px 0 12px; }
        .site-card img {
            display: block; width: 100%; aspect-ratio: 16 / 9;
            object-fit: cover; border-radius: 12px;
        }
        .site-card a {
            display: inline-block; margin-top: 14px; color: #7dd3fc;
            font-weight: bold; text-decoration: none;
        }
        .site-card a:hover { text-decoration: underline; color: #fff; }
        footer { text-align: center; color: #8291a8; padding: 0 20px 30px; font-size: .9rem; }
    </style>
</head>
<body>
    <header>
        <!-- Título principal solicitado na atividade. -->
        <h1>Meus sites favoritos: Luigy Renan</h1>
        <p>Uma seleção de páginas que fazem parte do meu dia a dia.</p>
    </header>

    <main>
        <!-- Cada cartão apresenta o nome, a imagem e o link de um site favorito. -->
        <section class="site-card">
            <h2>YouTube</h2>
            <img src="imagens/site1.svg" alt="Imagem ilustrativa do YouTube">
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Acessar YouTube ↗</a>
        </section>

        <section class="site-card">
            <h2>GitHub</h2>
            <img src="imagens/site2.svg" alt="Imagem ilustrativa do GitHub">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">Acessar GitHub ↗</a>
        </section>

        <section class="site-card">
            <h2>Crunchyroll</h2>
            <img src="imagens/site3.svg" alt="Imagem ilustrativa da Crunchyroll">
            <a href="https://www.crunchyroll.com" target="_blank" rel="noopener noreferrer">Acessar Crunchyroll ↗</a>
        </section>

        <section class="site-card">
            <h2>Spotify</h2>
            <img src="imagens/site4.svg" alt="Imagem ilustrativa do Spotify">
            <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer">Acessar Spotify ↗</a>
        </section>

        <section class="site-card">
            <h2>Minecraft</h2>
            <img src="imagens/site5.svg" alt="Imagem ilustrativa do Minecraft">
            <a href="https://www.minecraft.net" target="_blank" rel="noopener noreferrer">Acessar Minecraft ↗</a>
        </section>
    </main>

    <footer>
        <p>Atividade Agenda 12 — Desenvolvimento de Sistemas I</p>
    </footer>
</body>
</html>
